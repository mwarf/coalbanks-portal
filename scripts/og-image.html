<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    background: #F9F8F5;
    font-family: 'Inter', system-ui, sans-serif;
    color: #1A1A1A;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 80px 90px;
  }

  .top {
    display: flex;
    flex-direction: column;
    gap: 40px;
  }

  .logo {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 72px;
    letter-spacing: -1px;
    color: #1A1A1A;
    line-height: 1;
  }

  .logo .dot {
    color: #D4C9B0;
  }

  .tagline {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    font-size: 32px;
    color: #6B6B6B;
    letter-spacing: 0.5px;
  }

  .bottom {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .url {
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 24px;
    color: #6B6B6B;
  }

  .accent-line {
    width: 120px;
    height: 4px;
    background: #D4C9B0;
    border-radius: 2px;
  }

  .subtle-mark {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 18px;
    color: #D4C9B0;
    text-transform: uppercase;
    letter-spacing: 3px;
  }
</style>
</head>
<body>
  <div class="top">
    <div class="logo">Coalbanks<span class="dot">.</span></div>
    <div class="tagline">Private Client Portal</div>
  </div>
  <div class="bottom">
    <div class="accent-line"></div>
    <div class="subtle-mark">Coalbanks Creative Inc.</div>
  </div>
</body>
</html>
